version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud_storage_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud_storage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cloud_storage_app
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud_storage
      POSTGRES_MAX_CONNS: 10
      STORAGE_BASE_PATH: /app/data/files
      STORAGE_MAX_FILE_SIZE_MB: 100
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      LOG_LEVEL: info
      JWT_SECRET: Nesecret_key_1234
      JWT_TTL: 24h
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: